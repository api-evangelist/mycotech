aid: mycotech
name: Mycotech
description: >-
  MYCL (Mycotech Lab) is an Indonesian biomaterials company, founded in 2015 and
  based in Bandung, that cultivates mushroom mycelium on agricultural waste to
  produce sustainable, carbon-sequestering alternatives to animal leather,
  plastics, and construction materials. Its flagship product is Mylea, a
  mycelium-based leather-like material, alongside Biobo binder board, MYCL
  Composite for architecture and interior design, and Mylea Sea, a seaweed-based
  biopolymer. A certified B Corp and Good Design Award winner backed by 500
  Global and the Unreasonable Group, MYCL sells physical materials and finished
  goods rather than software; it publishes no public API, developer portal, or
  developer documentation.
